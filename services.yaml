- Glances:
    - Processes:
        widget:
            type: glances
            url: http://{{HOMEPAGE_VAR_HOST_IP}}:61208
            version: 4
            metric: process

    - RAM:
        widget:
            type: glances
            url: http://{{HOMEPAGE_VAR_HOST_IP}}:61208
            metric: memory
            version: 4

    - CPU:
        href: https://glances.home.bjornverbakel.nl
        widget:
            type: glances
            url: http://{{HOMEPAGE_VAR_HOST_IP}}:61208
            metric: cpu
            version: 4

- Services:
    - Proxmox:
        icon: proxmox.svg
        href: https://proxmox.home.bjornverbakel.nl
        description: Hypervisor
        widget:
            type: proxmox
            url: https://192.168.2.200:8006
            username: {{HOMEPAGE_VAR_PROXMOX_TOKEN_ID}}
            password: {{HOMEPAGE_VAR_PROXMOX_TOKEN_SECRET}}
            node: pve-home

    - Home Assistant:
        icon: home-assistant.svg
        href: https://ha.home.bjornverbakel.nl
        description: Smart Home
        server: &local my-docker
        # widget:
        #     type: homeassistant
        #     url: http://192.168.2.13:8123
        #     key: {{HOMEPAGE_VAR_LONG_LIVED_ACCESS_TOKEN}}

    - Nextcloud:
        icon: nextcloud.svg
        href: https://nextcloud.home.bjornverbakel.nl
        description: Cloud Environment
        server: *local
        container: nextcloud
        # widget:
        #     type: nextcloud
        #     url: http://{{HOMEPAGE_VAR_HOST_IP}}:8002
        #     username: {{HOMEPAGE_VAR_NEXTCLOUD_USERNAME}}
        #     password: {{HOMEPAGE_VAR_NEXTCLOUD_PASSWORD}}

    - AdGuard Home:
        icon: adguard-home.svg
        href: https://adguard.home.bjornverbakel.nl
        description: Ad Blocking
        server: *local
        container: adguardhome
        widget:
            type: adguard
            url: http://{{HOMEPAGE_VAR_HOST_IP}}:3000
            username: {{HOMEPAGE_VAR_ADGUARD_USERNAME}}
            password: {{HOMEPAGE_VAR_ADGUARD_PASSWORD}}

- Media:
    - Jellyfin:
        icon: jellyfin.svg
        href: https://jellyfin.home.bjornverbakel.nl
        description: Media Streaming
        server: *local
        container: jellyfin
        widget:
            fields: ["movies", "series", "episodes"]
            type: jellyfin
            url: http://jellyfin:8096
            key: {{HOMEPAGE_VAR_JELLYFIN_API_KEY}}
            version: 2
            enableBlocks: true
            enableNowPlaying: false
            enableUser: true
            enableMediaControl: false

    - Seerr:
        icon: seerr.svg
        href: https://seerr.home.bjornverbakel.nl
        description: Media Requests
        server: *local
        container: seerr
        widget:
            type: seerr
            url: http://seerr:5055
            key: {{HOMEPAGE_VAR_SEERR_API_KEY}}
    
    - qBittorrent:
        icon: qbittorrent.svg
        href: https://qbt.home.bjornverbakel.nl
        description: Torrent Client
        server: *local
        container: qbittorrent
        widget:
          type: qbittorrent
          url: http://gluetun:8080
          username: {{HOMEPAGE_VAR_QBITTORRENT_USERNAME}}
          password: {{HOMEPAGE_VAR_QBITTORRENT_PASSWORD}}

    - Sonarr:
        icon: sonarr.svg
        href: https://sonarr.home.bjornverbakel.nl
        description: Series Manager
        server: *local
        container: sonarr
        # widget:
        #     type: sonarr
        #     url: http://{{HOMEPAGE_VAR_HOST_IP}}:8989
        #     key: {{HOMEPAGE_VAR_SONARR_API_KEY}}

    - Radarr:
        icon: radarr.svg
        href: https://radarr.home.bjornverbakel.nl
        description: Movie Manager
        server: *local
        container: radarr
        # widget:
        #     type: radarr
        #     url: http://{{HOMEPAGE_VAR_HOST_IP}}:7878
        #     key: {{HOMEPAGE_VAR_RADARR_API_KEY}}

    - Lidarr:
        icon: lidarr.svg
        href: https://lidarr.home.bjornverbakel.nl
        description: Music Manager
        server: *local
        container: lidarr
        # widget:
        #     type: lidarr
        #     url: http://lidarr:8686
        #     key: {{HOMEPAGE_VAR_LIDARR_API_KEY}}

    - Prowlarr:
        icon: prowlarr.svg
        href: https://prowlarr.home.bjornverbakel.nl
        description: Indexer Manager
        server: *local
        container: prowlarr
        # widget:
        #     type: prowlarr
        #     url: http://prowlarr:9696/
        #     key: {{HOMEPAGE_VAR_PROWLARR_API_KEY}}

- Utilities:
    - What's Up Docker:
        icon: whats-up-docker.svg
        href: https://wud.home.bjornverbakel.nl
        description: Container Updates
        server: *local
        container: wud
        widget:
            type: whatsupdocker
            url: http://wud:3000
            label: Updates
            username: {{HOMEPAGE_VAR_WUD_USERNAME}}
            password: {{HOMEPAGE_VAR_WUD_PASSWORD}}

    - Portainer:
        icon: portainer.svg
        href: https://portainer.home.bjornverbakel.nl
        description: Docker Manager
        server: *local
        container: portainer
        widget:
          type: portainer
          url: https://portainer:9443
          env: 3
          key: {{HOMEPAGE_VAR_PORTAINER_ACCESS_KEY}}

    - Gluetun:
        icon: gluetun.svg
        href: https://gluetun.home.bjornverbakel.nl
        description: VPN Tunnel (qBittorrent)
        server: *local
        container: gluetun
        widget:
            type: gluetun
            url: http://gluetun:8000

    - Tailscale:
        icon: tailscale.svg
        href: https://login.tailscale.com/admin/machines
        description: Remote Access
        server: *local
        container: tailscale
        widget:
            type: tailscale
            deviceid: {{HOMEPAGE_VAR_TAILSCALE_DEVICE_ID}}
            key: {{HOMEPAGE_VAR_TAILSCALE_API_KEY}}